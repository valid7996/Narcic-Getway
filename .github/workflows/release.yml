name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        id: v
        run: |
          v=$(grep '^zedsecure.versionName=' gradle.properties | cut -d= -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match zedsecure.versionName=$v"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  desktop-natives:
    needs: version
    uses: ./.github/workflows/desktop-natives.yml
    secrets: inherit

  desktop:
    needs: [version, desktop-natives]
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android-apks, path: dist }
      - uses: actions/download-artifact@v4
        with: { pattern: "desktop-*", path: dist, merge-multiple: true }
      - name: One draft with every platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V='${{ needs.version.outputs.name }}'
          ls -l dist
          for f in "NarcicGetway-$V-arm64-v8a.apk" "NarcicGetway-$V-armeabi-v7a.apk" \
                   "NarcicGetway-$V-universal.apk" "NarcicGetway-$V-x86_64.apk" \
                   "NarcicGetway-$V-arm64-v8a-clean.apk" "NarcicGetway-$V-armeabi-v7a-clean.apk" \
                   "NarcicGetway-$V-universal-clean.apk" "NarcicGetway-$V-x86_64-clean.apk" \
                   "NarcicGetway-$V-x86_64.msi" "NarcicGetway-$V-windows-x86_64.zip"; do
            [ -f "dist/$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets..."
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Narcic Getway $V" --notes ""
          fi
